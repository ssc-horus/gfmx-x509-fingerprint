name: ghidra

# Run by hand (Actions > ghidra > Run workflow): runs connectors/ghidra/GFMXCertificates.py
# in headless Ghidra on the carving test binary and checks it finds both certificates.
# Not part of every push: Ghidra is a large download and the script changes rarely.

on:
  workflow_dispatch:
    inputs:
      ghidra_tag:
        description: Ghidra release tag on NationalSecurityAgency/ghidra
        default: Ghidra_12.1.4_build

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13.16"
      - name: Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.ghidra_tag }}" -R NationalSecurityAgency/ghidra -p 'ghidra_*_PUBLIC_*.zip' -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/ghidra_*.zip -d "$RUNNER_TEMP"
          echo "GHIDRA=$(ls -d "$RUNNER_TEMP"/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"
      - name: Script on go/extract/testdata/implant.bin
        run: |
          # what support/pyghidraRun -H does, without its interactive install prompt
          python3 -m pip install --no-index -f "$GHIDRA/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra
          mkdir -p "$RUNNER_TEMP/proj"
          GFMX_PY_DIR="$PWD" python3 -m pyghidra.ghidra_launch --install-dir "$GHIDRA" \
            ghidra.app.util.headless.AnalyzeHeadless "$RUNNER_TEMP/proj" gfmx \
            -import go/extract/testdata/implant.bin -loader BinaryLoader \
            -processor x86:LE:64:default -noanalysis \
            -scriptPath connectors/ghidra -postScript GFMXCertificates.py -deleteProject \
            2>&1 | tee ghidra.log
          grep -q "GFMX: 2 certificate(s) found" ghidra.log
