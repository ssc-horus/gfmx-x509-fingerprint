name: release

# Push a tag vX.Y.Z (and go/vX.Y.Z, so `go get github.com/ssc-horus/gfmx-x509-fingerprint/go@vX.Y.Z`
# works for the module in go/) to build the command-line tool and the C library and
# attach them to a GitHub release. The tag must match the version in the code.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.15.0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: "1.27.2"
      - name: Tag matches the code
        run: |
          want="${GITHUB_REF_NAME#v}"
          py=$(python3 gfmx.py --version | awk '{print $2}')
          go=$(cd go && go run ./cmd/gfmx --version | awk '{print $2}')
          echo "tag $want, Python $py, Go $go"
          test "$py" = "$want" && test "$go" = "$want"
      - name: Conformance before building
        run: |
          python3 tests/test_vectors.py
          (cd go && go test ./...)
      - name: Build
        working-directory: go
        run: |
          out="$RUNNER_TEMP/dist"; mkdir -p "$out"
          v="${GITHUB_REF_NAME}"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "$out/gfmx-$v-$os-$arch$ext" ./cmd/gfmx
          done
          lib="$RUNNER_TEMP/libgfmx-$v-linux-amd64"; mkdir -p "$lib"
          go build -buildmode=c-shared -trimpath -o "$lib/libgfmx.so" ./capi
          go build -buildmode=c-archive -trimpath -o "$lib/libgfmx.a" ./capi
          cp capi/example/example.c "$lib/"
          tar -C "$RUNNER_TEMP" -czf "$out/libgfmx-$v-linux-amd64.tar.gz" "libgfmx-$v-linux-amd64"
          (cd "$out" && sha256sum * > SHA256SUMS)
          cat "$out/SHA256SUMS"
      - name: Smoke test the Linux build
        run: |
          "$RUNNER_TEMP/dist/gfmx-${GITHUB_REF_NAME}-linux-amd64" --version
          "$RUNNER_TEMP/dist/gfmx-${GITHUB_REF_NAME}-linux-amd64" go/extract/testdata/ca.der
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: ${{ runner.temp }}/dist/*
          generate_release_notes: false
          body: See CHANGELOG.md for this version.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
